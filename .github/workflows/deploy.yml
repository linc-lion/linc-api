name: Deploy to Heroku

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_env:
        type: choice
        description: 'Deployment Environment'
        required: true
        options:
          - stage
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HEROKU_APP_NAME: ${{ github.event.inputs.deploy_env == 'prod' && 'linc-api' || 'linc-api-staging' }}
      HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
    steps:
      - name: Check if deploying to prod from non-main branch
        if: ${{ github.event.inputs.deploy_env == 'prod' && github.ref != 'refs/heads/main' }}
        run: |
          echo "Error: Deployment to production from a branch other than main is not allowed."
          exit 1
      - name: Install Heroku CLI
        run: |
          curl https://cli-assets.heroku.com/install.sh | sh 
      - uses: actions/checkout@v4
      - uses: akhileshns/heroku-deploy@e3eb99d45a8e2ec5dca08735e089607befa4bf28 # v3.14.15
        with:
          heroku_api_key: ${{ secrets.HEROKU_API_KEY }}
          heroku_app_name: ${{ env.HEROKU_APP_NAME }}
          heroku_email: ${{ secrets.HEROKU_SERVICE_ACCOUNT_EMAIL }}
